name: Generate Gradle Wrapper

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/generate-gradle-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      # Generate the wrapper in a clean, empty project so that the app's
      # Android/Kotlin plugins are not loaded during wrapper generation.
      - name: Generate Gradle Wrapper in temporary project
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-project"
          cd "$RUNNER_TEMP/wrapper-project"
          printf "rootProject.name = 'wrapper-bootstrap'\n" > settings.gradle
          gradle wrapper --gradle-version 9.4.1 --distribution-type bin

      - name: Copy Gradle Wrapper into repository
        run: |
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapper-project/gradlew" .
          cp "$RUNNER_TEMP/wrapper-project/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-project/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          cp "$RUNNER_TEMP/wrapper-project/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          chmod +x gradlew

      - name: Commit Gradle Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          if git diff --cached --quiet; then
            echo "No Gradle Wrapper changes to commit."
          else
            git commit -m "Add Gradle Wrapper"
            git push
          fi
