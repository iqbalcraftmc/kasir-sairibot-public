<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS - SairiBot Kasir</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 text-center">
        <div class="flex items-center justify-center mb-4">
            <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl">
                SB
            </div>
        </div>
        <h1 class="text-xl font-bold text-gray-800">SairiBot Kasir</h1>
        <p class="text-gray-500 text-xs mb-6">Silakan scan QRIS di bawah ini untuk membayar</p>
        
        <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-4 text-left">
            <div class="mb-2">
                <span class="text-xs text-gray-400 uppercase font-semibold">Nomor Invoice</span>
                <p id="inv-id" class="text-sm font-bold text-gray-800 break-all">-</p>
            </div>
            <div>
                <span class="text-xs text-gray-400 uppercase font-semibold">Total Tagihan</span>
                <p id="total-amount" class="text-xl font-extrabold text-blue-600">-</p>
            </div>
        </div>

        <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 mb-6 flex justify-center items-center bg-white min-h-[220px]">
            <img id="qris-img" src="" alt="QRIS Code" class="w-52 h-52 object-contain hidden">
            <p id="loading-text" class="text-gray-400 text-sm animate-pulse">Memuat QRIS Pembayaran...</p>
        </div>

        <button onclick="window.location.reload()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-md">
            Muat Ulang Halaman
        </button>

        <p class="text-gray-400 text-[10px] mt-6">Powered by SairiBot API & GitHub Pages</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const inv = urlParams.get('inv');
        const total = urlParams.get('total');
        const qris = urlParams.get('qris');

        if (inv) {
            document.getElementById('inv-id').innerText = inv;
        }

        if (total) {
            const formattedTotal = Number(total).toLocaleString('id-ID');
            document.getElementById('total-amount').innerText = 'Rp ' + formattedTotal;
        }

        if (qris) {
            const imgElement = document.getElementById('qris-img');
            const loadingText = document.getElementById('loading-text');
            
            if (qris.startsWith('http')) {
                imgElement.src = qris;
            } else {
                imgElement.src = qris.startsWith('data:image') ? qris : 'data:image/png;base64,' + qris;
            }
            
            imgElement.onload = function() {
                imgElement.classList.remove('hidden');
                loadingText.classList.add('hidden');
            };
            
            imgElement.onerror = function() {
                loadingText.innerText = 'Gagal memuat gambar QRIS.';
            };
        } else {
            document.getElementById('loading-text').innerText = 'Data pembayaran tidak ditemukan atau link tidak valid.';
        }
    </script>
</body>
</html>
